# Destruye toda la infraestructura creada con Terraform.
# Se ejecuta a mano y pide escribir "destroy" para confirmar.
# Para conservar los datos de Dgraph, antes correr scripts/snapshot-data-volume.sh.
name: Destroy infra

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "destroy" para confirmar'
        required: true

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform-destroy:
    name: Terraform destroy
    if: ${{ inputs.confirm == 'destroy' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      # destroy también evalúa las variables, por eso necesita app_env.
      TF_VAR_app_env: ${{ secrets.APP_ENV_JSON }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      # Terraform empaqueta la Lambda desde BACKEND/dist-lambda, así que hay que compilarla antes.
      - name: Compilar la Lambda
        working-directory: BACKEND
        run: |
          npm ci --ignore-scripts
          npm run build:lambda

      - name: Instalar Terraform y conectar con HCP Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve

      - name: Borrar el bucket de fotos (S3)
        # El bucket no está en el state de Terraform (ver infra/s3.tf), se borra aparte.
        run: bash ../scripts/ensure-s3-bucket.sh --delete
